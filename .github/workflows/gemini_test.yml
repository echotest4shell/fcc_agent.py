name: Gemini Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google SDK
        run: pip install "google-genai>=1.0.0,<2.0.0"

      - name: Search for Real Madrid result
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -u - <<'PY'
          import os
          from google import genai
          from google.genai import types

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"],
              http_options=types.HttpOptions(timeout=60000),
          )

          print("Asking Gemini to search for Real Madrid's result...", flush=True)

          response = client.models.generate_content(
              model="gemini-3.8-flash",
              contents=(
                  "Use Google Search to check Real Madrid men's first-team "
                  "football match on November 4, 2026, using the Madrid "
                  "local calendar date. "
                  "Return the opponent, competition, match status, score, "
                  "and goalscorers in a small table. "
                  "If the match is live, label the score as live. "
                  "If it has not started, say so. "
                  "If there is no match that day, say that clearly "
                  "instead of substituting a different day's result. "
                  "Do not guess. Include source URLs."
              ),
              config=types.GenerateContentConfig(
                  tools=[
                      types.Tool(google_search=types.GoogleSearch())
                  ],
              ),
          )

          print("Gemini replied:", response.text, flush=True)

          for candidate in response.candidates or []:
              metadata = candidate.grounding_metadata
              if metadata:
                  for chunk in metadata.grounding_chunks or []:
                      if chunk.web:
                          print("Source:", chunk.web.uri, flush=True)
          PY
